    <script>
      (function () {
        var path = window.location.pathname;
        var isMasterAdmin = path.indexOf('/master-admin') === 0;
        var isSellerAdmin = path.indexOf('/seller') === 0;
        var manifest = isMasterAdmin ? '/manifest-admin.webmanifest' : (isSellerAdmin ? '/manifest-seller-admin.webmanifest' : '/manifest.webmanifest');
        var title = isMasterAdmin ? 'Bitez Master Admin' : (isSellerAdmin ? 'Bitez Admin' : 'Bitez');
        var theme = isMasterAdmin ? '#0A0A0F' : (isSellerAdmin ? '#050505' : '#E9EEF5');
        var standalone = isMasterAdmin || isSellerAdmin;
        document.write('<link rel="manifest" href="' + manifest + '">');
        document.write('<meta name="apple-mobile-web-app-title" content="' + title + '">');
        document.write('<meta name="theme-color" content="' + theme + '">');
        document.write('<meta name="apple-mobile-web-app-capable" content="' + (standalone ? 'yes' : 'no') + '">');
        document.write('<meta name="mobile-web-app-capable" content="' + (standalone ? 'yes' : 'no') + '">');
        document.documentElement.className += (isSellerAdmin ? ' seller-admin-route admin-app-route' : '') + (isMasterAdmin ? ' master-admin-route admin-app-route' : '');
        if (!isSellerAdmin && !isMasterAdmin) {
          document.documentElement.className += ' user-app-route';
        }
      })();
    </script>
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: hsl(222 47% 6%); }
      body { background: #05070D; }
      #root:empty { min-height: 100vh; min-height: 100dvh; background: #05070D; }
      /* User app surfaces — keep light from the very first paint so the dark
         admin body background never bleeds through behind translucent cards
         (e.g. the Cart page liquid-glass sections). */
      html.user-app-route,
      html.user-app-route body,
      html.user-app-route #root,
      html.user-app-route #root:empty { background: hsl(214 32% 94%); }
    </style>
